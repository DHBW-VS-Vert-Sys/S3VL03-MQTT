services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf

  subscriber:
    image: eclipse-mosquitto:2.0
    container_name: mqtt-subscriber
    depends_on:
      - mosquitto
    entrypoint: >
      sh -c "sleep 2 &&
             mosquitto_sub -h mosquitto -t test/topic"

  publisher:
    image: eclipse-mosquitto:2.0
    container_name: mqtt-publisher
    depends_on:
      - mosquitto
    entrypoint: sh

